<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAI - Deep Relax Engine</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>
<body>

<h1>SAI Deep Relax</h1>

<div class="controls">

<label>Base Frequency: <span id="baseVal">200</span>Hz</label>
<input type="range" id="baseFreq" min="100" max="400" value="200">

<label>Noise: <span id="noiseVal">0.2</span></label>
<input type="range" id="noiseAmt" min="0" max="0.5" step="0.01" value="0.2">

<br>
<button id="startBtn">Start</button>
<button id="stopBtn">Stop</button>

</div>

<script src="audioEngine.js"></script>
<script src="analyticsEngine.js"></script>
<script src="aiEngine.js"></script>

<script>
document.getElementById("startBtn").onclick = ()=>{
  AudioEngine.start();
  AIEngine.startSession();
};

document.getElementById("stopBtn").onclick = ()=>{
  AudioEngine.stop();
  AnalyticsEngine.endSession();
};

baseFreq.oninput=()=>baseVal.textContent=baseFreq.value;
noiseAmt.oninput=()=>noiseVal.textContent=noiseAmt.value;

if('serviceWorker' in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
