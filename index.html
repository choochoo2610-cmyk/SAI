<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAI Extreme Audio Engine</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>SAI ∞ Extreme Audio</h1>

<div class="panel">

<button id="startBtn">START</button>
<button id="stopBtn">STOP</button>

<h3>Brainwave Preset</h3>
<select id="preset">
<option value="2">Δ Delta (2Hz)</option>
<option value="6">θ Theta (6Hz)</option>
<option value="10" selected>α Alpha (10Hz)</option>
<option value="18">β Beta (18Hz)</option>
</select>

<h3>Waveform</h3>
<select id="waveform">
<option value="sine">Sine</option>
<option value="triangle">Triangle</option>
<option value="sawtooth">Saw</option>
</select>

<h3>Base Frequency</h3>
<input type="range" id="baseFreq" min="100" max="400" value="200">

<h3>Spatial Speed</h3>
<input type="range" id="moveSpeed" min="0" max="5" step="0.1" value="1">

<h3>Breathing Mode</h3>
<button id="breathBtn">Toggle Breathing Sync</button>

<h3>Heartbeat Sync</h3>
<input type="range" id="bpm" min="60" max="90" value="70">

</div>

<script src="audioEngine.js"></script>
</body>
</html>
